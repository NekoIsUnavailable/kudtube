name: Build & Release KudTube

on:
  push:
    branches: [ master, main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # -------------------------------------------------------------
  # Desktop Builds: Windows, macOS, Linux
  # -------------------------------------------------------------
  build-desktop:
    name: Build Desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
        include:
          - os: windows-latest
            platform: win
          - os: macos-latest
            platform: mac
          - os: ubuntu-latest
            platform: linux

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Linux build dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libarchive-tools libmpv-dev

      - name: Compile and Build Web Assets
        run: npm run build

      - name: Build Electron App (${{ matrix.platform }})
        run: npx electron-builder --${{ matrix.platform }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Desktop Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kudtube-${{ matrix.platform }}
          path: |
            release_kudtube/*.exe
            release_kudtube/*.zip
            release_kudtube/*.dmg
            release_kudtube/*.AppImage
            release_kudtube/*.deb
          if-no-files-found: ignore

  # -------------------------------------------------------------
  # Mobile Build: Android APK
  # -------------------------------------------------------------
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Install dependencies
        run: npm ci

      - name: Build React App
        run: npm run build

      - name: Sync Capacitor Android
        run: npx --yes @capacitor/cli sync android

      - name: Build Android Debug APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Copy & Name APK
        run: |
          mkdir -p release_apk
          cp android/app/build/outputs/apk/debug/app-debug.apk release_apk/KudTube.apk

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: kudtube-android-apk
          path: release_apk/KudTube.apk
          if-no-files-found: ignore

  # -------------------------------------------------------------
  # Automated GitHub Release (on Push or Tag)
  # -------------------------------------------------------------
  release:
    name: Create GitHub Release
    needs: [build-desktop, build-android]
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v1.0.1' }}
          name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'KudTube Release v1.0.1' }}
          prerelease: false
          fail_on_unmatched_files: false
          files: |
            kudtube-win/*
            kudtube-mac/*
            kudtube-linux/*
            kudtube-android-apk/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
